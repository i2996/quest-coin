# 안드로이드 앱(APK) 만들기
# - main 에 android-app/ 이 바뀌어 머지되면 자동으로, 또는 Actions → '안드로이드 앱 만들기' → Run workflow
# - 만들어진 APK 는 저장소 Releases 의 'android-latest' 에 올라감 → 폰에서 받아 설치
# 처음 한 번: 저장소 Settings → Secrets and variables → Actions 에 GOOGLE_SERVICES_JSON
#   (Firebase 에서 받은 google-services.json 내용 전체) 을 넣어주세요. 없으면 알림 없이 만들어져요.
name: 안드로이드 앱 만들기

on:
  push:
    branches: [main]
    paths: ['android-app/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 준비
        working-directory: android-app
        run: npm ci
      - name: Firebase 설정 넣기
        working-directory: android-app
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json 넣음 (알림 사용)"
          else
            echo "::warning::GOOGLE_SERVICES_JSON 이 없어서 알림 없이 만들어요."
          fi
      - name: 앱 동기화
        working-directory: android-app
        run: npx cap sync android
      - name: APK 만들기
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../quest-coin.apk
      - uses: actions/upload-artifact@v4
        with:
          name: quest-coin-apk
          path: quest-coin.apk
      - name: Releases 에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: 퀘스트코인 안드로이드 앱 (최신)
          body: |
            폰에서 아래 **quest-coin.apk** 를 눌러 받고 설치하세요.
            (처음 설치할 때 '출처를 알 수 없는 앱 설치'를 허용해야 해요)
            버전 1.0.${{ github.run_number }}
          files: quest-coin.apk
          make_latest: true
