# 알림 함수(qc-notify)를 Supabase 에 배포
# - main 에 supabase/functions/ 가 바뀌어 머지되면 자동으로 배포
# - 저장소 Actions 탭 → '알림 함수 배포' → Run workflow 로 직접 실행도 가능 (폰 GitHub 앱에서도 됨)
# 처음 한 번: 저장소 Settings → Secrets and variables → Actions 에 SUPABASE_ACCESS_TOKEN 을 넣어주세요.
#   ('우리 가족' 저장소에 넣은 것과 같은 토큰. 값을 모르면 supabase.com → Account → Access Tokens 에서 새로 만들기)
name: 알림 함수 배포

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', '.github/workflows/deploy-functions.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ivfeomuxwzxyzmixiyyv # js/config.js 의 Supabase 주소 앞부분
    steps:
      - name: 토큰 확인
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::GitHub 저장소 Settings → Secrets and variables → Actions 에 SUPABASE_ACCESS_TOKEN 을 먼저 넣어주세요."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: qc-notify 배포
        # Supabase CLI 는 npm 으로 받음 (setup-cli 의 'latest' 조회는 GitHub API 한도에 걸려 실패할 때가 있었음)
        # --no-verify-jwt: DB 트리거가 부르는 함수라 로그인 토큰 대신 DB 에 저장된 비밀값으로 확인함 (앱의 점검은 함수 안에서 로그인 확인)
        # 실패하면 한 번 더 시도 (일시적인 네트워크 문제 대비)
        run: |
          for i in 1 2; do
            npx --yes supabase@latest functions deploy qc-notify --project-ref "$PROJECT_REF" --no-verify-jwt --use-api --yes && exit 0
            echo "배포 실패, 20초 뒤 다시 시도 ($i)"; sleep 20
          done
          exit 1
