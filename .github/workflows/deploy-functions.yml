# 알림 함수(qc-notify)를 Supabase 에 배포
# - main 에 supabase/functions/ 가 바뀌어 머지되면 자동으로 배포
# - 저장소 Actions 탭 → '알림 함수 배포' → Run workflow 로 직접 실행도 가능 (폰 GitHub 앱에서도 됨)
# 처음 한 번: 저장소 Settings → Secrets and variables → Actions 에 SUPABASE_ACCESS_TOKEN 을 넣어주세요.
#   ('우리 가족' 저장소에 넣은 것과 같은 토큰. 값을 모르면 supabase.com → Account → Access Tokens 에서 새로 만들기)
name: 알림 함수 배포

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ivfeomuxwzxyzmixiyyv # js/config.js 의 Supabase 주소 앞부분
    steps:
      - name: 토큰 확인
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::GitHub 저장소 Settings → Secrets and variables → Actions 에 SUPABASE_ACCESS_TOKEN 을 먼저 넣어주세요."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: qc-notify 배포
        # --no-verify-jwt: DB 트리거가 부르는 함수라 로그인 토큰 대신 DB 에 저장된 비밀값으로 확인함
        run: supabase functions deploy qc-notify --project-ref "$PROJECT_REF" --no-verify-jwt --yes
